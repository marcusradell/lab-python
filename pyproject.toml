[project]
name = "lab-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Marcus Rådell", email = "marcus@radell.net" }]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.12.1",
    "faster-whisper>=1.2.0",
    "numpy>=2.3.4",
    "pyaudio>=0.2.14",
    "pydantic>=2.12.3",
    "questionary>=2.1.1",
    "types-confluent-kafka>=1.3.6",
    "types-pyaudio>=0.2.16.20250801",
]

[project.scripts]
lab-python = "lab_python:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
